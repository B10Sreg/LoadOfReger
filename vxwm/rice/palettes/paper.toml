# Палитра темы. Из неё генерируются colors.Xresources, rofi.rasi и
# kitty.conf -- см. vxwm/rice/mktheme.py. Больше тема ничем не отличается:
# picom.conf у всех тем общий, обои лежат рядом отдельным файлом.

name = "paper"
description = "светлая тёплая бумага с коричневым акцентом"

[ui]
# Шесть цветов, которые видит vxwm: текст, фон и рамка для обычного
# и для активного окна. Из них же выводятся цвета бара.
norm_fg     = "#5c574f"
norm_bg     = "#edeae4"
norm_border = "#d6d1c8"
sel_fg      = "#2b2721"
sel_bg      = "#ddd7cc"
sel_border  = "#8a6a3f"

# Приглушённый текст: подсказка в rofi, пустые теги в баре.
muted       = "#948d82"

# Фон выпадающих окон (rofi). В тёмных темах он темнее norm_bg, здесь --
# наоборот светлее: меню всё так же должно отделяться от окон под ним.
dim_bg      = "#f7f5f1"

[ansi]
# Палитра терминала. Выводить её из шести цветов интерфейса нечем --
# это отдельные оттенки, и подбираются они на глаз.
# Светлая тема переворачивает привычный порядок: color0 -- самый тёмный
# «чернильный», а color15 не белый, иначе текст исчез бы на фоне.
color0  = "#2b2721"
color1  = "#a33a35"
color2  = "#4a7339"
color3  = "#8a6a1f"
color4  = "#36607f"
color5  = "#74477a"
color6  = "#356e69"
color7  = "#5c574f"
color8  = "#6e675d"
color9  = "#b84c45"
color10 = "#5e8f48"
color11 = "#a8822c"
color12 = "#487a9d"
color13 = "#8d5d93"
color14 = "#468a83"
color15 = "#2b2721"

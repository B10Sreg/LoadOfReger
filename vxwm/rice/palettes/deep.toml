# Палитра темы. Из неё генерируются colors.Xresources, rofi.rasi и
# kitty.conf -- см. vxwm/rice/mktheme.py. Больше тема ничем не отличается:
# picom.conf у всех тем общий, обои лежат рядом отдельным файлом.

name = "deep"
description = "глубокий нейтральный графит"

[ui]
# Шесть цветов, которые видит vxwm: текст, фон и рамка для обычного
# и для активного окна. Из них же выводятся цвета бара.
norm_fg     = "#8a8a8e"
norm_bg     = "#1e1e20"
norm_border = "#2a2a2d"
sel_fg      = "#ffffff"
sel_bg      = "#2a2a2d"
sel_border  = "#c0c0c0"

# Приглушённый текст: подсказка в rofi, пустые теги в баре.
muted       = "#5a5a5e"

# Фон выпадающих окон (rofi). Обычно чуть темнее norm_bg, чтобы меню
# читалось поверх окон, а не сливалось с ними.
dim_bg      = "#1e1e20"

[ansi]
# Палитра терминала. Выводить её из шести цветов интерфейса нечем --
# это отдельные оттенки, и подбираются они на глаз.
color0  = "#1e1e20"
color1  = "#b06a6a"
color2  = "#8ba888"
color3  = "#c9b28a"
color4  = "#7c93ad"
color5  = "#a98bb0"
color6  = "#7fada8"
color7  = "#c0c0c0"
color8  = "#5a5a5e"
color9  = "#d08a8a"
color10 = "#a8c2a5"
color11 = "#dcc7a0"
color12 = "#9db3c9"
color13 = "#c2a6c8"
color14 = "#9bc4bf"
color15 = "#ffffff"

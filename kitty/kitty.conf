# ==========================================================================
# Graphite Theme: CARBON — тёплый тёмный ганметал
# ==========================================================================
font_family      JetBrainsMono Nerd Font
font_size        10.0

background_opacity         0.85
dynamic_background_opacity yes
window_padding_width       12

background            #1c1a18
foreground            #c9b28a
selection_background  #2b2825
selection_foreground  #f5efe6
cursor                #c9b28a

enable_audio_bell no

# ANSI-палитра: приглушённые, но узнаваемые оттенки (диффы/вим/ls остаются читаемыми)
color0  #1c1a18
color8  #5c554c
color1  #b8735f
color9  #d19678
color2  #93a878
color10 #aebf90
color3  #c9a86a
color11 #ddc084
color4  #8a95a8
color12 #a0aec0
color5  #b08a9a
color13 #c9a2b3
color6  #7fa89a
color14 #9bc0b0
color7  #c9b28a
color15 #f5efe6

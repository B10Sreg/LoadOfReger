# Настройки риса: единственное место, которое правят руками.
#
# Всё остальное -- Xresources, picom.conf, rofi.rasi, kitty.conf, dunstrc,
# цвета в vxbar -- из этого файла генерируется, см. apply.py. Поэтому править
# сгенерированные конфиги бессмысленно: следующий apply их перепишет.
#
# Живой файл лежит в ~/.config/vxwm-rice/rice.toml; этот, в репозитории, --
# значения по умолчанию и заодно документация.
#
#   apply.py          -- применить всё
#   apply.py --theme  -- только тему (быстрее: не трогает композитор)

[theme]
# Имя палитры из rice/palettes. Обои берутся из themes/<имя>/wallpaper.png,
# и если их нет -- остаются прежние.
name = "carbon"

[windows]
# Зазор между окнами и толщина рамки. Едут через X resources, поэтому
# меняются на лету: ни пересборки vxwm, ни перезапуска сессии.
gap = 10
border = 2

[compositor]
enabled = true
vsync = true
# Чем picom рисует: "glx" (через GPU, по умолчанию) или "xrender" (через CPU).
# xrender спасает на старом железе и в виртуальной машине: анимации станут
# заметно проще, зато исчезнут артефакты и падения драйвера.
backend = "glx"
# Перерисовывать только изменившуюся часть экрана. Выключи на проприетарном
# драйвере nvidia: там это даёт мерцание и следы от окон (см. docs/nvidia.md).
use_damage = true
# Анимации композитора: переезд и изменение размера окон, появление и
# исчезновение. Пружина настроена в templates/picom.conf.tmpl, там же замеры --
# трогать её без записи экрана бессмысленно, на глаз разница между "плавно" и
# "дёргается" не ловится.
animations = true
# Чем рисуется появление и исчезновение окна. Само листание тегов от них не
# зависит (его рисует пружина picom, см. templates/picom.conf.tmpl, раздел
# "Смена тега") -- но окна нового тега мапятся заново, поэтому open_animation
# играет и на них, пока они ещё за краем экрана. С "zoom" окно въезжает,
# доразворачиваясь на ходу; "slide-in" у picom означает появление без анимации,
# и тогда листание получается чистым, зато и новые окна открываются рывком.
#
# На выбор: zoom, slide-up, slide-down, slide-left, slide-right, slide-in,
# slide-out, slide-in-center, slide-out-center, squeeze, squeeze-bottom,
# minimize, fly-in, none. Все slide-* -- не переезд через экран, а разворот
# от одного из краёв самого окна.
open_animation = "zoom"
close_animation = "slide-down"
shadow = true
shadow_radius = 18
shadow_opacity = 0.4
blur = true
blur_strength = 6
fading = true
corner_radius = 8
# --- Прозрачность ---
# Всё задаётся долей непрозрачности: 1.0 -- сплошной цвет, 0.0 -- невидимка.
# Прозрачность бара. Сам бар -- это dock в терминах picom.
bar_opacity = 0.80
# Обычные окна: файловые менеджеры, браузер, окна без своей прозрачности.
window_opacity = 0.90
# Те же окна, когда не в фокусе. Фокус видно и без рамки.
inactive_opacity = 0.82
# Терминал. Едет не через picom, а через background_opacity самого kitty:
# так прозрачным становится только фон, а текст остаётся чётким.
terminal_opacity = 0.75
# Меню и уведомления: rofi, выпадающие меню, dunst.
menu_opacity = 0.85

[session]
# Восстанавливать окна прошлой сессии при входе.
restore = true
# Как часто демон переснимает список окон, секунды. Снимок нужен на случай,
# когда гибернация не случилась: внезапное выключение, разряженный UPS.
snapshot_interval = 20

[input]
# Раскладка клавиатуры, как её понимает setxkbmap: "us,ru" -- две раскладки,
# пустая строка -- не трогать то, что уже настроено в системе (так ставит
# установщик в режиме «поверх существующей системы»).
layout = "us,ru"
# Чем переключать. Пусто -- без переключателя.
#
# Имей в виду: Alt+Shift пересекается с хоткеями vxwm, потому что Mod -- это
# Alt. Любой Mod+Shift+что-нибудь (перенос окна на тег, Mod+Shift+W, гашение
# сессии) заодно переключит раскладку. Если это надоест -- есть три выхода:
# "grp:caps_toggle" (переключение по CapsLock), "grp:win_space_toggle"
# (Super+Пробел) или смена MODKEY на Mod4Mask (Super) в vxwm-src/config.def.h.
options = "grp:alt_shift_toggle"

[power]
# Блокировать экран по простою. Требует пакета xss-lock; без него настройка
# просто не действует.
lock_on_idle = true
idle_seconds = 600

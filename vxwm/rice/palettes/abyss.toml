# Палитра темы. Из неё генерируются colors.Xresources, rofi.rasi и
# kitty.conf -- см. vxwm/rice/mktheme.py. Больше тема ничем не отличается:
# picom.conf у всех тем общий, обои лежат рядом отдельным файлом.

name = "abyss"
description = "глубокая сине-зелёная с бирюзовым акцентом"

[ui]
# Шесть цветов, которые видит vxwm: текст, фон и рамка для обычного
# и для активного окна. Из них же выводятся цвета бара.
norm_fg     = "#7d94a0"
norm_bg     = "#0f1a1f"
norm_border = "#1c2b33"
sel_fg      = "#e3f0f3"
sel_bg      = "#1c2b33"
sel_border  = "#58b8b0"

# Приглушённый текст: подсказка в rofi, пустые теги в баре.
muted       = "#4a5f6b"

# Фон выпадающих окон (rofi). Чуть темнее norm_bg, чтобы меню читалось
# поверх окон, а не сливалось с ними.
dim_bg      = "#0a1317"

[ansi]
# Палитра терминала. Выводить её из шести цветов интерфейса нечем --
# это отдельные оттенки, и подбираются они на глаз.
color0  = "#0f1a1f"
color1  = "#c96a6a"
color2  = "#6fb28a"
color3  = "#c9a86a"
color4  = "#6a9ec9"
color5  = "#a98bc9"
color6  = "#58b8b0"
color7  = "#b8ccd4"
color8  = "#4a5f6b"
color9  = "#e08a8a"
color10 = "#8fcfa8"
color11 = "#ddc48a"
color12 = "#8ab9e0"
color13 = "#c2a6e0"
color14 = "#7fd4cc"
color15 = "#e3f0f3"
